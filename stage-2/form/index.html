<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form</title>
</head>
<body>
    <form action="/confirm-form" autocomplete="on" method="POST">
        <fieldset>
            <legend>Registration Form</legend>
            <div class="form-part">
                <label for="first-name">First name:</label>
                <input type="text" id="first-name" name="firstName" placeholder="Ilya" minlength="2" required>
            </div>

            <div class="form-part">
                <label for="last-name">Last name:</label>
                <input type="text" id="last-name" name="lastName" placeholder="Tolstenkov" minlength="2" required>
            </div>
            
            <div class="form-part">
                <label for="age">Age:</label>
                <input type="text" id="age" name="age" pattern="\d*" placeholder="42" value="42" minlength="1" maxlength="3" required>
            </div>

            <div class="form-part">
                <label for="phone-number">Phone number:</label>
                <input type="tel" id="phone-number" name="phoneNumber" placeholder="+375291234567" pattern="^\+[1-9]\d{1,14}$" maxlength="15" required>
            </div>

            <div class="form-part">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="***(min length = 8)" minlength="8" required>
            </div>

            <div class="form-part">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="name@gmail.com" required>
            </div>

            <div class="form-part">
                <label for="city">City:</label>
                <select id="city" name="city" required>
                    <option value="" selected>Select city</option>
                    <option value="brest">Brest</option>
                    <option value="vitebsk">Vitebsk</option>
                    <option value="gomel">Gomel</option>
                    <option value="grodno">Grodno</option>
                    <option value="minsk">Minsk</option>
                    <option value="mogilev">Mogilev</option>
                </select>
            </div>

            <fieldset class="form-part radio-group">
                <legend>How we knew about us:</legend>
                <div class="radio-option">
                    <input type="radio" name="recognition" value="friends" id="radio-friends" required>
                    <label for="radio-friends">From friends</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="recognition" value="internet" id="radio-internet" required>
                    <label for="radio-internet">On the Internet</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="recognition" value="advertisement" id="radio-advertisement" required>
                    <label for="radio-advertisement">From advertisement</label>
                </div>
            </fieldset>
            
            <div class="form-part">
                <label for="disabled-input">Disabled field:</label>
                <input type="text" id="disabled-input" name="disabledField" value="Test-data" disabled>
            </div>

            <div class="form-part">
                <label for="comment">Comment:</label>
                <textarea name="comment" id="comment" placeholder="I like eat hotdogs..." required></textarea>
            </div>

            <div class="form-part checkbox-group">
                <input type="checkbox" name="acceptConditions" id="accept-conditions" required>
                <label for="accept-conditions">I accept the conditions of company</label>
            </div>
            <button type="submit">Submit</button>
        </fieldset>
    </form>
</body>
</html>
